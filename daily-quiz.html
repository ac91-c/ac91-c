<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quiz - Lavendra Collection</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Serif+Sinhala:wght@400;600;700&family=Noto+Sans+Sinhala:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2C2A29;
            --secondary: #8C7B6D;
            --accent: #D4AF37;
            --bg-light: #F9F8F6;
            --white: #FFFFFF;
            --text-main: #2B2825;
            --text-muted: #665E55;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.1);
            --border-subtle: rgba(140, 123, 109, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            font-size: 14px; /* Optimized for 320px screens */
        }

        @media(min-width: 768px) {
            body {
                font-size: 16px;
            }
        }

        h1, h2, h3, .serif-font {
            font-family: 'Playfair Display', 'Noto Serif Sinhala', serif;
            color: var(--primary);
        }

        a {
            text-decoration: none;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: transparent;
            border-bottom: 1px solid transparent;
            box-shadow: none;
            transition: var(--transition);
        }

        header.scrolled {
            background: var(--white);
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-subtle);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 65px;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 0.85rem; /* Adjusted for tighter 320px viewports */
            gap: 0.5rem; /* Prevents logo and back button from colliding */
        }

        @media(min-width: 768px) {
            .nav-container {
                height: 90px;
                padding: 0 2rem;
                gap: 1rem;
            }
        }

        .logo {
            font-size: 0.85rem; /* Adjusted slightly smaller to completely prevent right-side clipping on 320px */
            font-weight: 700;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            color: var(--white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1; /* Allows logo to shrink cleanly instead of cropping */
            min-width: 0;
            transition: var(--transition);
        }

        header.scrolled .logo {
            color: var(--primary);
        }

        @media(min-width: 768px) {
            .logo {
                font-size: 1.8rem;
                letter-spacing: 2px;
                flex-shrink: 0;
            }
        }

        .logo span {
            color: var(--accent);
            font-style: italic;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem; /* Smaller navbar button size for 320px screens */
            background-color: transparent;
            color: var(--white);
            font-weight: 600;
            font-size: 0.65rem; /* Smaller navbar text size for 320px screens */
            letter-spacing: 0.3px;
            text-transform: uppercase;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0; /* Ensures back button never shrinks or crops */
        }

        header.scrolled .back-home-btn {
            color: var(--primary);
            border-color: var(--secondary);
        }

        @media(min-width: 768px) {
            .back-home-btn {
                padding: 0.6rem 1.4rem;
                font-size: 0.75rem;
                letter-spacing: 1px;
            }
        }

        .back-home-btn:hover {
            background-color: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        header.scrolled .back-home-btn:hover {
            background-color: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        /* --- HERO SECTION --- */
        .quiz-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 100px 0.85rem;
            background: linear-gradient(rgba(44, 42, 41, 0.6), rgba(44, 42, 41, 0.6)), url('lavendra-collection-stationery-supplies.webp') no-repeat center center/cover;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        @media(min-width: 768px) {
            .quiz-hero {
                padding: 120px 2rem;
            }
        }

        .hero-container {
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-hero h1 {
            font-size: clamp(1.6rem, 5vw, 3.5rem); /* Prevents text breaking on 320px */
            margin-bottom: 1rem;
            font-weight: 600;
            word-wrap: break-word;
            color: var(--white);
        }

        .quiz-hero p {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            max-width: 750px;
            margin: 0 auto;
            color: var(--bg-light);
            font-weight: 400;
            line-height: 1.7;
        }

        /* --- QUIZ SECTION GRID --- */
        .quiz-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2.5rem 0.85rem; /* Adjusted for 320px */
        }

        @media(min-width: 768px) {
            .quiz-container {
                padding: 6rem 2rem;
            }
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem; /* Optimized spacing for small screens */
        }

        @media(min-width: 768px) {
            .quiz-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 2rem;
            }
        }

        @media(min-width: 1024px) {
            .quiz-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .quiz-card {
            border-radius: 12px;
            padding: 1.75rem 1.25rem; /* Adjusted padding for 320px width constraints */
            box-shadow: var(--shadow-subtle);
            transition: var(--transition);
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            word-wrap: break-word;
        }

        @media(min-width: 768px) {
            .quiz-card {
                padding: 2.5rem 2rem;
            }
        }

        .quiz-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 22px 45px rgba(44, 42, 41, 0.12);
            border-color: var(--border-subtle);
        }

        /* Distinct Bright & Vivid Pastel Background Themes per Card */
        .quiz-card:nth-child(1) {
            background-color: #FFF3CD; /* Bright Warm Yellow Pastel */
        }

        .quiz-card:nth-child(2) {
            background-color: #D1E7DD; /* Bright Mint Green Pastel */
        }

        .quiz-card:nth-child(3) {
            background-color: #CFF4FC; /* Bright Cyan/Sky Blue Pastel */
        }

        .quiz-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            gap: 0.5rem;
            flex-wrap: wrap; /* Ensures status and tag stack gracefully if screen is extremely narrow */
        }

        .quiz-tag {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
        }

        .quiz-status {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .quiz-card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .quiz-sub-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--secondary);
            font-weight: 600;
            margin-bottom: 0.85rem;
        }

        .quiz-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .start-quiz-btn {
            background-color: transparent;
            color: var(--primary);
            width: 100%;
            padding: 0.85rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            border: 1px solid var(--secondary);
            cursor: pointer;
            font-family: inherit;
        }

        .start-quiz-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            color: var(--white);
            box-shadow: 0 10px 20px rgba(44, 42, 41, 0.15);
            transform: translateY(-2px);
        }

        /* --- FOOTER --- */
        footer {
            background-color: #232120;
            color: #B5A89E;
            padding: 2.5rem 0;
            font-size: 0.8rem;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        @media(min-width: 768px) {
            footer {
                padding: 4rem 0;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header id="header">
        <div class="nav-container">
            <a href="index.html" class="logo">Lavendra <span>Collection</span></a>
            <a href="index.html" class="back-home-btn">
                <i class="fa-solid fa-arrow-left"></i> Back
            </a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="quiz-hero">
        <div class="hero-container">

    <!-- Quizzes Grid Section -->
    <main class="quiz-container">
        <div class="quiz-grid" id="quizGrid">
            <!-- Quiz Card 1 -->
           
          
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div style="max-width: 1280px; margin: 0 auto; padding: 0 1rem;">
            <p style="font-weight: 500; color: #FFFFFF;">&copy; 2026 Lavendra Collection. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', function() {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>

</body>
</html>
